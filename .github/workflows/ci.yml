# Continuous integration: every push and pull request is linted, built and
# tested on GitHub's machines. The end-to-end (browser) tests are slower, so
# they only run on master and when started by hand from the Actions tab.
name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only need to read the code.
permissions:
  contents: read

# Settings every job's commands see. These are throwaway values for the
# temporary test database, not real secrets.
env:
  NODE_VERSION: 22
  DB_HOST: localhost
  DB_PORT: 5432
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: portfolioddd_test
  JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else

# Jobs run on a fixed Ubuntu version (not ubuntu-latest), so the pipeline
# doesn't change under a project that sits untouched for months.
jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolioddd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The test setup applies the migrations itself.
      - run: npm test

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:frontend

  e2e:
    name: End-to-end tests
    needs: [checks, backend-tests, frontend-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolioddd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate
      # Playwright starts the backend and the Vite dev server itself
      # (see playwright.config.ts).
      - run: npm run test:e2e
        env:
          # Every browser test comes from one address; the real limits would
          # trip. (Only here: the backend tests check those limits.)
          DISABLE_RATE_LIMIT: 'true'
      # Screenshots of failed tests, downloadable from the run's page.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
